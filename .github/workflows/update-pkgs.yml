name: Update packages

# Modelled on numtide/llm-agents.nix and nix-community/ethereum.nix: discover
# every flake package with a version, run nix-update on each, and open one PR
# per package (branch update/<name>, reused on later runs). Opt a package out
# with `passthru.skipUpdate = true;`.

on:
  workflow_dispatch:
    inputs:
      packages:
        description: Packages to update (space-separated, empty for all)
        required: false
        default: ""
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

concurrency:
  group: update-pkgs
  cancel-in-progress: false

# Pushes and PRs use secrets.GH_TOKEN instead
permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.discover.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
      - id: discover
        env:
          FILTER: ${{ inputs.packages }}
        run: |
          packages=$(nix eval --json .#packages.x86_64-linux --apply '
            ps: builtins.filter
              (n: ps.${n} ? version && !(ps.${n}.passthru.skipUpdate or false))
              (builtins.attrNames ps)')
          if [[ -n "$FILTER" ]]; then
            packages=$(jq -c --arg f "$FILTER" '($f | split(" ") | map(select(. != ""))) as $w | map(select(IN($w[])))' <<<"$packages")
          fi
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          jq -r '.[]' <<<"$packages"

  update:
    needs: discover
    if: needs.discover.outputs.packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}
    env:
      PKG: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-nix
      # nix-update evaluates <nixpkgs> to run a passthru.updateScript: use the
      # flake's, already fetched, instead of downloading a channel
      - run: echo "NIX_PATH=nixpkgs=$(nix eval --raw --inputs-from . nixpkgs#path)" >> "$GITHUB_ENV"

      # Updating the PR resets its branch, so leave alone a PR with fixes pushed
      # by hand (non-merge commits not from the bot); it's yours to finish.
      - name: Check for manual fixes
        id: manual
        run: |
          git fetch -q origin "update/$PKG" 2>/dev/null || exit 0
          authors=$(git log --no-merges --format=%ae "origin/main..FETCH_HEAD")
          if [[ -n $authors ]] && grep -qv 'github-actions\[bot\]' <<<"$authors"; then
            echo "::notice::update/$PKG has manual commits, leaving its PR alone"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run nix-update
        id: update
        if: steps.manual.outputs.skip != 'true'
        run: |
          version() { nix eval --raw ".#packages.x86_64-linux.$PKG.version" 2>/dev/null || echo unknown; }
          old=$(version)
          log="$RUNNER_TEMP/nix-update.log"
          # Packages nix-update can't handle alone carry a passthru.updateScript
          args=()
          if [[ $(nix eval ".#packages.x86_64-linux.$PKG" --apply 'p: p ? updateScript') == true ]]; then
            args+=(--use-update-script)
          fi
          if nix run --inputs-from . nixpkgs#nix-update -- --flake "${args[@]}" "$PKG" 2>&1 | tee "$log"; then
            failed=false
          else
            failed=true
          fi

          if git diff --quiet; then
            if [[ $failed == true ]]; then
              echo "::error::nix-update failed for $PKG before changing anything"
              exit 1
            fi
            echo "$PKG is up to date"
            exit 0
          fi

          # nix-update takes the highest version upstream lists, which can be
          # older than ours (e.g. GitHub omitting recent releases).
          new=$(version)
          if [[ $new != unknown && $(nix eval --expr "builtins.compareVersions \"$new\" \"$old\"") == -1 ]]; then
            echo "::error::Refusing to downgrade $PKG from $old to $new"
            exit 1
          fi

          # nix-update stops partway on failure (e.g. the version is bumped but
          # a dependency hash isn't), so the PR shows what needs fixing.
          body="$RUNNER_TEMP/body.md"
          if [[ $failed == true ]]; then
            {
              echo "nix-update failed for \`$PKG\`, so this update needs a manual fix: push it to this branch and mark the PR ready."
              echo
              echo '```'
              tail -n 40 "$log"
              echo '```'
            } > "$body"
          else
            echo "Automated \`nix-update --flake $PKG\` run." > "$body"
          fi
          {
            echo "title=chore(pkgs): update $PKG $old -> $new"
            echo "failed=$failed"
            echo "body=$body"
          } >> "$GITHUB_OUTPUT"

      # A token other than GITHUB_TOKEN, so the PR triggers the Check workflow.
      # A rerun with a newer version updates the existing PR (title included).
      - if: steps.update.outputs.title
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GH_TOKEN }}
          branch: update/${{ matrix.package }}
          delete-branch: true
          commit-message: ${{ steps.update.outputs.title }}
          title: ${{ steps.update.outputs.title }}
          body-path: ${{ steps.update.outputs.body }}
          draft: ${{ steps.update.outputs.failed == 'true' && 'always-true' || 'false' }}
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>

      # Squash-merges once the required checks (lint, eval, build) pass
      - if: steps.pr.outputs.pull-request-number && steps.update.outputs.failed == 'false'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
          TITLE: ${{ steps.update.outputs.title }}
        run: |
          # An earlier failed run may have left it a draft
          if [[ $(gh pr view "$PR" --json isDraft --jq .isDraft) == true ]]; then
            gh pr ready "$PR"
          fi
          gh pr merge "$PR" --auto --squash --subject "$TITLE (#$PR)"

      # Keep the run red so failures show up in Actions too
      - if: steps.update.outputs.failed == 'true'
        run: |
          echo "::error::nix-update failed for $PKG; opened a draft PR"
          exit 1
