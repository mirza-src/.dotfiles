# Force the scroller layout to be the default for all workspaces
tag_rule=id:*,layout_name:scroller

# Force every single window to take up 100% of the screen width
scroller_default_proportion=1.0

# Prevent single windows from shrinking or behaving differently
scroller_ignore_proportion_single=0

# Lock the focused window exactly to the center of the viewport (Crucial Niri mechanic)
scroller_focus_center=1

# Strip all gap structures/padding when windows are at full proportion
scroller_structs=0

# Bitwarden closes to the tray and reopens on the same surface. If the reopened
# window gets a different size (another workspace's layout), Electron never
# draws it and the window stays hidden. Floating keeps its own size.
# TODO: report to Electron (Ozone/Wayland) and drop once fixed.
window_rule=app_id:^(bitwarden)$,is_floating:1
